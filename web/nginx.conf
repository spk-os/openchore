server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Video proof can be up to 100MB (the API's own limit) — leave nginx headroom.
    client_max_body_size 110m;

    location = /index.html {
        # Always revalidate the entry file: a stale index.html keeps serving
        # the previous release's hashed assets after every deploy.
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /assets/ {
        # Content-hashed filenames: safe to cache forever.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Large uploads shouldn't hit the proxy read timeout mid-transfer.
        proxy_request_buffering off;
        proxy_read_timeout 86400;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
    }

    location /tts/ {
        proxy_pass http://api:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

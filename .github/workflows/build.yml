name: Build and Push Images

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install e2e dependencies
        run: cd e2e && npm ci

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Copy seed config
        run: cp config/config.example.yaml config/config.yaml

      - name: Run e2e tests
        run: cd e2e && npx playwright test
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # 原 build-api / build-web job 已删除：镜像由 SPK-OS 本地构建
  # （Containerfile / web/Containerfile + delivery/app compose），不经 ghcr.io 发布；
  # 上游 ghcr 发布通道在自建 Gitea 上不可用（GITHUB_TOKEN 非 ghcr.io 凭证）。

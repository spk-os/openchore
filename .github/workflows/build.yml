name: Build and Push Images

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

  test-e2e:
    runs-on: ubuntu-latest
    # 串行执行：自建 act_runner 的两个 job 容器共享宿主 hostedtoolcache，
    # setup-go/setup-node 并发写同一版本目录会互相踩（2026-11-08 test job
    # 曾报 `Command failed: version not found`，恰逢 test-e2e 同刻解压同版 Go）。
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install e2e dependencies
        run: cd e2e && npm ci

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Copy seed config
        run: cp config/config.example.yaml config/config.yaml

      - name: Show runner environment
        run: |
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "go: $(go version)"
          echo "CPUs: $(nproc)"
          echo "mem-free: $(free -m | awk '/^Mem:/{print $4}')MB"
          df -h / | tail -1

      - name: Run e2e tests
        run: cd e2e && npx playwright test --workers=4 --reporter=line
        env:
          CI: true
          # 显式端口避开常用端口：runner 容器网络（gitea_default）内 8080/5173
          # 无占用，但显式声明消除任何与宿主映射端口的潜在冲突。
          E2E_API_PORT: "8181"
          E2E_WEB_PORT: "5281"

      # upload-artifact 已删除：Gitea Actions（act_runner）不支持 artifact v4 API
      # （GHESNotSupportedError），失败时上传会把 job 拖红。需要报告时直接
      # 看 job 日志或本地复跑 `cd e2e && npx playwright test --reporter=line`。

  # 原 build-api / build-web job 已删除：镜像由 SPK-OS 本地构建
  # （Containerfile / web/Containerfile + delivery/app compose），不经 ghcr.io 发布；
  # 上游 ghcr 发布通道在自建 Gitea 上不可用（GITHUB_TOKEN 非 ghcr.io 凭证）。
